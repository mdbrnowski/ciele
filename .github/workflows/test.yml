name: Gleam CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.3"
          gleam-version: "1.17.0"
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam build
      - run: gleam test
