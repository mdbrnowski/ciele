name: Gleam CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.19.5"
          rebar3-version: "3.27.0"
          gleam-version: "1.17.0"
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam build
      - run: gleam test
