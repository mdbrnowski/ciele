name: Erlang CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - otp: "25.3.2"
            rebar3: "3.19.0"
          - otp: "27.3.3"
            rebar3: "3.25.1"
    steps:
    - uses: actions/checkout@v6
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{matrix.otp}}
        rebar3-version: ${{matrix.rebar3}}
    - run: rebar3 compile
    - run: rebar3 xref
