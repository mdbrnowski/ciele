name = "ciele"
version = "0.1.0"
description = "Monitors static websites and emails you when they change."
licences = ["MIT"]
gleam = ">= 1.17.0"

[dependencies]
gleam_stdlib = ">= 1.0.3 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
shellout = ">= 1.8.0 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
logging = ">= 1.5.0 and < 2.0.0"
filepath = ">= 1.1.2 and < 2.0.0"
gleam_regexp = ">= 1.1.1 and < 2.0.0"
tom = ">= 2.1.0 and < 3.0.0"
floki = ">= 0.38.4 and < 1.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
